<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="peOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="peGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Crown + Globe Icon Hybrid -->
  <g transform="translate(10, 10)">
    <circle cx="50" cy="50" r="46" fill="#0f172a" />
    <circle cx="50" cy="50" r="42" fill="none" stroke="url(#peOrange)" stroke-width="4" />
    <!-- Wing & Arrow -->
    <path d="M 28 58 L 52 42 L 72 32 L 64 54 L 46 62 Z" fill="url(#peOrange)" />
    <!-- Mini Crown -->
    <path d="M 38 40 L 42 26 L 50 34 L 58 26 L 62 40 Z" fill="url(#peGold)" />
  </g>

  <!-- PRIME -->
  <text x="125" y="65" font-family="'Bricolage Grotesque', sans-serif" font-weight="900" font-size="48" fill="#0f172a" letter-spacing="2">PRIME</text>
  <text x="290" y="65" font-family="'Bricolage Grotesque', sans-serif" font-weight="900" font-size="48" fill="url(#peOrange)" letter-spacing="1">ENTREPRISE</text>

  <!-- Subtitle -->
  <text x="126" y="92" font-family="'Manrope', sans-serif" font-weight="700" font-size="13" fill="#ea580c" letter-spacing="3">SHIPPING • STORE • LOGISTIQUE HAÏTI</text>
</svg>
