<svg xmlns="http://www.w3.org/2000/svg" viewBox="140 90 365 295" width="100%" height="100%">
  <defs>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="20%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="bagNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Circular Badge Arc / Ring -->

  <!-- Shopping Bag Illustration in Navy -->
  <g filter="url(#dropShadow)">
    <!-- Bag Handle in Gold -->
    <path d="M 220 135 C 220 90 280 90 280 135" fill="none" stroke="url(#goldRing)" stroke-width="12" stroke-linecap="round" />
    <circle cx="220" cy="138" r="8" fill="url(#goldRing)" />
    <circle cx="280" cy="138" r="8" fill="url(#goldRing)" />

    <!-- Bag Main 3D Shape -->
    <!-- Side gusset fold -->
    <polygon points="175,130 195,126 182,345 152,340" fill="#0f172a" />
    <polygon points="195,126 210,126 198,348 182,345" fill="#334155" />
    <!-- Front face -->
    <polygon points="210,126 310,126 300,348 198,348" fill="url(#bagNavy)" stroke="#1e293b" stroke-width="3" />
  </g>

  <!-- Golden Crown Above PRIME -->
  <g filter="url(#dropShadow)">
    <path d="M 215 175 L 222 145 L 238 160 L 250 130 L 262 160 L 278 145 L 285 175 Z" fill="url(#goldText)" stroke="#a16207" stroke-width="2" />
    <circle cx="222" cy="144" r="3.5" fill="#fef08a" />
    <circle cx="250" cy="129" r="4.5" fill="#fef08a" />
    <circle cx="278" cy="144" r="3.5" fill="#fef08a" />
  </g>

  <!-- Typography: PRIME in 3D Gold -->
  <text x="325" y="270" font-family="'Bricolage Grotesque', 'Arial Black', sans-serif" font-weight="900" font-size="108" fill="url(#goldText)" text-anchor="middle" filter="url(#dropShadow)" letter-spacing="1">PRIME</text>

  <!-- Typography: BOUTIQUE in Deep Navy with shadow -->
  <text x="325" y="340" font-family="'Bricolage Grotesque', 'Arial Black', sans-serif" font-weight="900" font-size="64" fill="url(#goldText)" text-anchor="middle" letter-spacing="2">BOUTIQUE</text>

  <!-- Golden Swoosh Accent Line Under Boutique -->
  <path d="M 200 375 Q 290 355 385 345" fill="none" stroke="url(#goldRing)" stroke-width="10" stroke-linecap="round" />
</svg>
