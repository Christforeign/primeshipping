<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hors connexion — Prime Shipping</title>
  <style>
    :root{--background:#fff8f0;--foreground:#281d15;--muted:#746557;--primary:#e96516;--primary-foreground:#ffffff}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--background);color:var(--foreground);font:16px/1.6 system-ui,sans-serif}main{max-width:32rem;padding:2rem;text-align:center}img{width:12rem;height:9rem;object-fit:contain}h1{font-size:1.5rem}p{color:var(--muted)}a{color:var(--primary);overflow-wrap:anywhere}button{border:0;border-radius:8px;background:var(--primary);color:var(--primary-foreground);padding:12px 24px;font:inherit;cursor:pointer}
  </style>
</head>
<body><main>
  <img src="/logos/prime-shipping-email.png" alt="Prime Shipping">
  <h1>Vous êtes hors connexion</h1>
  <p>Pensez à acheter un forfait internet ou à vous connecter au Wi-Fi pour retrouver Prime Shipping.</p>
  <p id="support" hidden><a id="phone"></a></p>
  <button onclick="location.reload()">Réessayer</button>
</main><script>
  try { const phone=localStorage.getItem('prime_support_phone'); if(phone){const link=document.getElementById('phone');link.textContent='Support : '+phone;link.href='tel:'+phone.replace(/[^+0-9]/g,'');document.getElementById('support').hidden=false;} } catch {}
  window.addEventListener('online',()=>location.reload());
</script></body>
</html>
